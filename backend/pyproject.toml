[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twi"
version = "0.1.0"
requires-python = ">=3.12"
# Cotas superiores conservadoras (IT-00C, N03): sin ellas el CI puede romper
# en cualquier momento por un release upstream sin que cambie el repo.
dependencies = [
    "fastapi>=0.136.3,<0.140",
    "starlette>=1.3.0,<2",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.13.4,<3",
    "python-multipart>=0.0.9,<0.1",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "mypy>=1.10,<3",
    "ruff>=0.4,<1",
    "types-beautifulsoup4>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "perf: performance / budget tests",
    "real_wld: tests that require real .wld files in the corpus",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B"]
