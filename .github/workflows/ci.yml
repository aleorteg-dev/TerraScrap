name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Typecheck
        run: python -m mypy src/twi --strict
      - name: Ruff
        run: |
          python -m ruff check src tests
          python -m ruff format src tests --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Generate API schema types
        run: npm run gen:api
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Smoke
        run: bash docker/smoke.sh
      - name: Scan images
        run: bash docker/scan.sh terrascrap-backend:latest terrascrap-frontend:latest
